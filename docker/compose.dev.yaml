# =============================================================================
# Sketch Video Studio — Local / Development Compose Override
# Usage:
#   docker compose -f docker/compose.yaml -f docker/compose.dev.yaml up --build -d
# =============================================================================

services:
  sketch-web:
    build:
      args:
        VITE_BG_API_BASE: ""
    ports:
      - "127.0.0.1:8881:8080"

  sketch-bg-api:
    environment:
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8881,http://127.0.0.1:8881,http://localhost:8880,http://127.0.0.1:8880"
    volumes:
      - ../kivy/web/tools/background_server.py:/app/background_server.py:ro
    ports:
      - "127.0.0.1:7000:7000"
