name: CD — Release Build & Ubuntu Server Deployment

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Release version tag to deploy (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Publish Versioned Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.app_version }}" ]; then
            echo "version=${{ github.event.inputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sketch-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sketch-video-studio-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sketch-video-studio-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sketch-bg-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bg-api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sketch-video-studio-bg-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sketch-video-studio-bg-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Ubuntu Server (With Approval & Auto-Rollback)
    runs-on: ubuntu-latest
    needs: publish-images
    environment:
      name: production
    steps:
      - name: Deploy over SSH and verify health (or auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/sketch-studio
            git fetch --all --tags
            git checkout main
            git pull --ff-only
            bash infrastructure/scripts/deploy.sh "${{ needs.publish-images.outputs.version }}"
