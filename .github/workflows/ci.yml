name: CI — Build, Test & Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  frontend-quality:
    name: Frontend Typecheck, Unit Tests & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kivy/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: kivy/web/package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Audit NPM dependencies for High/Critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Run unit test suite (Vitest)
        run: npm test

      - name: Verify production TypeScript & Vite build
        run: npm run build

  backend-verification:
    name: Backend FastAPI Syntax & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kivy/web/tools/requirements-background.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kivy/web/tools/requirements-background.txt

      - name: Verify FastAPI app import & /health endpoint
        run: |
          python -c "import sys; sys.path.insert(0, 'kivy/web/tools'); import background_server; assert background_server.health()['ready'] is True"

  container-security-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sketch-web production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          load: true
          tags: sketch-video-studio-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan sketch-web image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "sketch-video-studio-web:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Validate Docker Compose configurations
        run: |
          docker network create edge_proxy || true
          docker compose -f docker/compose.yaml -f docker/compose.dev.yaml config --quiet
          docker compose -f docker/compose.yaml -f docker/compose.prod.yaml config --quiet
          docker compose -f docker/compose.infra.yaml config --quiet
